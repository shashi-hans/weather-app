<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Weather Sky</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #bae6fd 0%, #e0f2fe 60%);
      color: #0c2340; text-align: center; padding: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #4a7fa5; margin: 0; max-width: 20rem; }
  </style>
</head>
<body>
  <div>
    <div class="icon">🌦️</div>
    <h1>Weather Sky needs a connection</h1>
    <p>This app loads live weather from the web. Turn on mobile data or Wi-Fi, then reopen it.</p>
  </div>
</body>
</html>
